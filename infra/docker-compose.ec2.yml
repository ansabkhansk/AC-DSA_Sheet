# PATH A — Fast AWS deployment (single EC2, no CloudFront/S3).
# Serves React (Vite dist) + API behind one Nginx origin on :80/:443.
#
# Prerequisites on the host:
#   /etc/dsa-sheet/api.env          — production API env (see .env.production.example)
#   infra/web-dist/                 — copy of apps/web/dist (built on a machine with RAM)
#   infra/certs/fullchain.pem       — Let's Encrypt (or equivalent) cert chain
#   infra/certs/privkey.pem         — private key
#
# From /opt/dsa-sheet (repo root on EC2):
#   export GHCR_IMAGE=ghcr.io/<you>/dsa-sheet-api
#   export IMAGE_TAG=<sha-or-latest>
#   export API_ENV_FILE=/etc/dsa-sheet/api.env
#   docker compose -f infra/docker-compose.ec2.yml pull
#   docker compose -f infra/docker-compose.ec2.yml up -d
#
# PATH B continues to use infra/docker-compose.prod.yml + nginx.conf (API-only).

name: dsa-sheet-ec2

services:
  api1:
    image: ${GHCR_IMAGE:-ghcr.io/OWNER/dsa-sheet-api}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - ${API_ENV_FILE:-/etc/dsa-sheet/api.env}
    environment:
      PORT: 4000
      REDIS_ENABLED: 'true'
      REDIS_URL: redis://redis:6379
      NODE_OPTIONS: '--max-old-space-size=256'
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - internal

  api2:
    image: ${GHCR_IMAGE:-ghcr.io/OWNER/dsa-sheet-api}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - ${API_ENV_FILE:-/etc/dsa-sheet/api.env}
    environment:
      PORT: 4000
      REDIS_ENABLED: 'true'
      REDIS_URL: redis://redis:6379
      NODE_OPTIONS: '--max-old-space-size=256'
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        'redis-server',
        '--maxmemory',
        '64mb',
        '--maxmemory-policy',
        'allkeys-lru',
        '--save',
        '',
        '--appendonly',
        'no',
      ]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - internal

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx.ec2.conf:/etc/nginx/nginx.conf:ro
      - ./web-dist:/usr/share/nginx/html:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/health']
      interval: 20s
      timeout: 5s
      retries: 5
    networks:
      - internal

networks:
  internal:
    driver: bridge

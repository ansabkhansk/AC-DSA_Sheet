# PATH A — EC2-only Nginx: SPA + /api on one origin (HTTPS).
# Used by infra/docker-compose.ec2.yml. Do not replace PATH B nginx.conf
# (CloudFront API origin) unless you intentionally switch architectures.
#
# Mounts expected by compose:
#   /usr/share/nginx/html  → Vite production build (apps/web/dist)
#   /etc/nginx/certs       → fullchain.pem + privkey.pem (Let's Encrypt)

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  server_tokens off;

  gzip on;
  gzip_proxied any;
  gzip_types application/json application/javascript text/plain text/css application/xml text/javascript;
  gzip_min_length 256;

  upstream api_upstream {
    least_conn;
    server api1:4000 max_fails=3 fail_timeout=10s;
    server api2:4000 max_fails=3 fail_timeout=10s;
  }

  # HTTP → HTTPS (and ACME webroot if you mount certbot challenges later)
  server {
    listen 80;
    server_name _;

    location /health {
      proxy_pass http://api_upstream/health;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Health (also useful from the host / monitoring)
    location /health {
      proxy_pass http://api_upstream/health;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
      proxy_pass http://api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Request-Id $http_x_request_id;
      proxy_set_header Cookie $http_cookie;
      proxy_pass_header Set-Cookie;
      proxy_buffering off;
    }

    # Hashed Vite assets — long cache
    location /assets/ {
      root /usr/share/nginx/html;
      try_files $uri =404;
      expires 1y;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA shell — always revalidate
    location = /index.html {
      root /usr/share/nginx/html;
      add_header Cache-Control "no-cache";
    }

    # SPA deep links (/sheet/..., /calendar, …)
    location / {
      root /usr/share/nginx/html;
      try_files $uri $uri/ /index.html;
    }
  }
}

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  server_tokens off;

  # Compress proxied JSON/API responses (P9 acceptance).
  gzip on;
  gzip_proxied any;
  gzip_types application/json application/javascript text/plain text/css application/xml;
  gzip_min_length 256;

  upstream api_upstream {
    least_conn;
    server api1:4000 max_fails=3 fail_timeout=10s;
    server api2:4000 max_fails=3 fail_timeout=10s;
  }

  # Used by CloudFront origin and EC2 health probes (C13).
  # Public browser traffic should hit CloudFront; this listens on HTTP only (R2 trade-off).
  server {
    listen 80;
    server_name _;

    location /health {
      proxy_pass http://api_upstream/health;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-Id $http_x_request_id;
    }

    location /api/ {
      proxy_pass http://api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      # CloudFront terminates TLS; tell Express the original scheme for Secure cookies.
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_set_header X-Request-Id $http_x_request_id;
      proxy_set_header Cookie $http_cookie;
      proxy_pass_header Set-Cookie;
      proxy_buffering off;
    }

    location / {
      return 404 '{"success":false,"error":{"code":"NOT_FOUND","message":"Use CloudFront for the SPA"}}';
      add_header Content-Type application/json;
    }
  }
}
